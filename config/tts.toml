# Configurazione TTS — decisa in M0 giorno 5 (decision gate D0).
#
# CONFRONTO MISURATO, latenza media di sintesi su 10 frasi:
#   kokoro if_sara        858 ms   fuori budget (100-250 ms)
#   kokoro im_nicola      898 ms   fuori budget
#   piper  paola medium   102 ms   IN BUDGET   <- scelto
#   piper  riccardo x_low  75 ms   in budget
#
# Con Kokoro la latenza end-to-end sarebbe 1687 ms, cioe' al limite del p95
# su OGNI turno, senza margine per la GUI di M3. Con Piper: 931 ms, sotto il
# p50 con ~270 ms di margine.
#
# Kokoro resta in `metis/tts/kokoro_engine.py` come alternativa: se un domani
# la qualita' dovesse contare piu' della latenza, il motore e' gia' scritto.

[voce]
# PHASE3 (2026-09-26): Paola piu' veloce, scelta dell'utente dopo aver ascoltato
# anche Kokoro. Vale per Piper e per Kokoro (la riserva). Ammessi 0.5-2.0: fuori,
# Metis non parte e dice perche'.
#
# ATTENZIONE: per Piper il numero NON e' un moltiplicatore della durata. Diventa
# `length_scale` = 1/velocita', e il modello non lo applica in proporzione.
# Misurato su 5 frasi di Metis (data/tts_compare/velocita/):
#   1.2 -> parlato  9% piu' corto  (come un lettore a 1,10x)
#   1.3 -> parlato 15% piu' corto  (come un lettore a 1,18x)   <- scelto: "1,2x"
#   1.4 -> parlato 21% piu' corto  (come un lettore a 1,26x)
#   1.5 -> parlato 25% piu' corto  (come un lettore a 1,33x)
velocita = 1.3

[engine]
backend = "piper"          # "piper" | "kokoro"
device  = "cpu"            # libera 0,4 GB di VRAM, §3.2 della specifica

[piper]
voice      = "it_IT-paola-medium"
voices_dir = "data/piper"

[kokoro]
voice     = "if_sara"
lang_code = "i"

[streaming]
# Il primo chunk esce piu' corto per anticipare l'inizio del parlato; i
# successivi sono piu' lunghi, perche' chunk piu' ampi danno prosodia migliore.
first_chunk_min_chars = 15
min_chars             = 25
