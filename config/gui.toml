# Interfaccia grafica (PHASE1).
#
# Questo file sta nel repository e NON contiene dati personali. La citta' del
# meteo va in `config/gui.local.toml`, stesso formato, ignorato da git: i
# valori del locale sostituiscono questi. Le Impostazioni dell'Hub lo
# scriveranno da sole; intanto si puo' scrivere a mano:
#
#     [meteo]
#     citta = "Milano"
#
# Con la sola citta', Metis trova le coordinate una volta (geocodifica di
# Open-Meteo) e le tiene in `data/meteo.json`. Con le coordinate non serve
# nemmeno quella:
#
#     [meteo]
#     citta = "Milano"
#     latitudine = 45.464
#     longitudine = 9.190
#
# Dal PC escono solo le coordinate, ogni 15 minuti, verso api.open-meteo.com.

[meteo]
citta = ""

# PHASE4 — il pannello "frasi non capite" della Diagnostica legge i turni di
# `data/logs/turns.jsonl` solo da questo istante in poi. Prima la suite dei
# test ci scriveva turni finti ("risposta finta", fonti su e0.it) che non si
# possono separare da quelli veri; l'ultimo e' delle 12:05 del 2026-09-28, e
# la correzione e' del pomeriggio dello stesso giorno. Le due sedute vere di
# quei giorni restano in `CONVOS/`, usate come casi di prova.
[frasi]
dal = "2026-09-28T14:35"
