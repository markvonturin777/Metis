[project]
name = "metis"
version = "0.1.0"
description = "Assistente personale vocale locale per Windows"
requires-python = ">=3.12,<3.13"

# Dipendenze della sola M0 (walking skeleton).
# Le altre si aggiungono iterazione per iterazione, non tutte subito:
# serve sapere quale pacchetto ha rotto cosa.
dependencies = [
    # audio
    "sounddevice",
    "soundfile",
    "numpy",
    "silero-vad",
    "soxr",          # il Yeti su WASAPI accetta solo 48 kHz: decimazione 3:1 a 16 kHz
    "pynput",
    # percezione
    "faster-whisper",
    # inferenza
    "ollama",
    # sintesi
    "kokoro",
    # telemetria
    "nvidia-ml-py",
    "psutil",
    # osservabilita
    "structlog",
    # M5 — conoscenza
    "ddgs",              # rinominato da duckduckgo_search
    "trafilatura",       # isola il contenuto principale scartando menu e banner
    "beautifulsoup4",    # ripiego, e pulizia del nascosto PRIMA dell'estrazione
    "lxml",
    "keyring",           # credenziali nel Credential Manager, mai nel repository
    # M6 — integrazioni
    "apscheduler>=3.10,<4",  # la 4 cambia l'API: i job salvati vanno migrati a mano
    "sqlalchemy",        # il jobstore persistente: senza, i promemoria muoiono al riavvio
    "tzlocal",
    "websockets",        # Home Assistant
    "win11toast",        # notifiche native di Windows
]

[project.optional-dependencies]
# `aiosmtpd` e `trustme`: un server SMTP vero e cifrato in locale, per provare
# la posta senza un account e senza spegnere la verifica del certificato.
# `pyinstaller`: il bundle di M7 (metis.spec).
dev = ["pytest", "pytest-cov", "ruff", "aiosmtpd", "trustme", "pyinstaller"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Senza questo, l'autodiscovery scambia SPECS/, TRACKING/, Claude/ e config/
# per pacchetti Python e rifiuta di procedere.
include = ["metis*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E741 ("l" ambiguo): `l, t, r, b` sono i nomi standard dei lati di un
# rettangolo nel codice geometrico di M4 (finestre, monitor, UIA).
# Rinominarli in `sinistra, alto, destra, basso` renderebbe illeggibili le
# formule. Eccezione dichiarata qui, in M7, per avere un lint a zero su cui
# il prossimo errore si veda.
select = ["E", "F", "W"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Nei test e nei banchi le sequenze di eventi si scrivono su una riga:
# `o.sm.fire(PTT); o.sm.fire(SPEECH_START)` si legge come una sequenza, che e'
# quello che e'. Nel codice di Metis la regola vale.
"tests/**" = ["E701", "E702"]
"benchmarks/**" = ["E701", "E702"]
"wakeword/**" = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
